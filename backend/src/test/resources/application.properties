spring.datasource.url=jdbc:h2:mem:taskflow_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=taskflow-test-secret-key-1234567890-abcdef
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6399
spring.data.redis.timeout=100ms
app.realtime.channel=taskflow-events-test

app.seed.admin.enabled=true
app.seed.admin.name=TaskFlow Admin
app.seed.admin.email=admin@taskflow.local
app.seed.admin.password=Admin123!

management.endpoints.web.exposure.include=health

# Unit/integration tests use H2 + Hibernate schema creation.
spring.flyway.enabled=false
