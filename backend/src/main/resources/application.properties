spring.application.name=taskflow-backend
server.port=${SERVER_PORT:8080}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# Flyway database migrations
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# If a complete task_manager_full.sql schema is imported first, baseline it at V2
# so Flyway does not try to re-apply V1/V2 on those existing tables.
spring.flyway.baseline-version=2
spring.flyway.validate-on-migrate=true

# JWT - use a long random secret outside development
app.jwt.secret=${JWT_SECRET:taskflow-dev-secret-key-change-me-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

# Redis event publishing. APIs continue working if Redis is temporarily unavailable.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1500ms
app.realtime.channel=${REALTIME_CHANNEL:taskflow-events}

# Reminder scheduler
app.reminders.scan-ms=${REMINDER_SCAN_MS:30000}

# Development admin seed, matching the uploaded frontend's default sign-in form.
app.seed.admin.enabled=${SEED_ADMIN_ENABLED:true}
app.seed.admin.name=${SEED_ADMIN_NAME:TaskFlow Admin}
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@taskflow.local}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:Admin123!}

# API documentation / health
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
